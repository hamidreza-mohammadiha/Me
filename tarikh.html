<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نقشه تعاملی روایت ایران</title>
<style>
:root{
  --bg:#101d1d;--panel:#152522;--gold:#e2c78c;--text:#eee8dc;
  --muted:#9aa9a0;--line:rgba(226,199,140,.18)
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
#tarikh-map-embed{
  width:100%;max-width:1400px;margin:auto;padding:clamp(8px,2vw,22px);
  direction:rtl;color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:clamp(10px,2vw,20px);
  overflow:hidden;font-family:Tahoma,Arial,sans-serif
}
.map-panel{position:relative;width:100%;min-width:0}
.map-top,.map-foot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.map-top{padding:3px 4px 14px;font-size:clamp(11px,1.2vw,14px)}
.map-sub,.map-foot{color:var(--muted)}
.live-dot{display:inline-block;width:7px;height:7px;margin-left:7px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 10px rgba(226,199,140,.7)}
.history-map{display:block;width:100%;height:auto;aspect-ratio:2/1;border-radius:12px;
  overflow:hidden;touch-action:none;user-select:none;cursor:grab}
.history-map:active{cursor:grabbing}
.country-label{fill:#aebc98;font-size:15px;font-family:Tahoma,Arial,sans-serif;pointer-events:none}
.iran-label{fill:var(--gold);font-size:18px;font-weight:700}
.sea-label{fill:rgba(210,220,210,.35);font-size:12px;font-family:Tahoma,Arial,sans-serif;pointer-events:none}
.map-marker{cursor:pointer;transition:filter .18s ease}
.map-marker:hover,.map-marker:focus,.map-marker.active{
  filter:brightness(1.45) drop-shadow(0 0 7px rgba(226,199,140,.9));outline:none}
.map-controls{position:absolute;top:clamp(62px,9vw,96px);left:clamp(10px,2vw,22px);
  z-index:10;display:flex;flex-direction:column;gap:6px}
.map-controls button{display:grid;place-items:center;width:38px;height:38px;padding:0;color:var(--gold);
  background:rgba(15,28,27,.88);border:1px solid rgba(226,199,140,.25);border-radius:8px;
  cursor:pointer;backdrop-filter:blur(8px)}
.map-controls button:hover{background:#2d453c}
.map-event{margin-top:clamp(12px,2vw,20px);padding:clamp(14px,2.5vw,23px);
  background:rgba(28,44,42,.55);border:1px solid rgba(226,199,140,.12);border-radius:12px}
.map-event .eyebrow{color:var(--gold);font-size:clamp(11px,1vw,13px)}
.map-event h3{margin:7px 0;font-size:clamp(18px,2.2vw,28px);font-weight:600}
.map-event p{max-width:850px;margin:0;color:#bcc6bf;font-size:clamp(12px,1.3vw,15px);line-height:1.9}
.map-foot{padding-top:12px;font-size:clamp(9px,1vw,12px)}
.map-foot span{display:flex;align-items:center;gap:5px}
@media(max-width:700px){
 #tarikh-map-embed{padding:8px;border-radius:10px}
 .map-top,.map-foot{align-items:flex-start;flex-direction:column;gap:5px}
 .history-map{min-height:280px}
 .map-controls{top:74px;left:11px}
 .map-controls button{width:34px;height:34px}
}
@media(max-width:420px){.history-map{min-height:245px}.map-event{padding:12px}}

.journey-controls{margin-top:14px;padding:14px;background:rgba(21,37,34,.72);border:1px solid rgba(226,199,140,.14);border-radius:12px}
.journey-buttons{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.journey-buttons button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 13px;color:#d8ded8;background:#162824;border:1px solid rgba(226,199,140,.18);border-radius:9px;cursor:pointer;font:inherit}
.journey-buttons button:hover:not(:disabled){background:#2d453c;color:#fff}.journey-buttons button:disabled{opacity:.32;cursor:not-allowed}
.journey-buttons .journey-play{color:var(--gold);border-color:rgba(226,199,140,.35)}
.journey-progress-wrap{margin-top:12px}.journey-caption{display:flex;justify-content:space-between;color:#9aa9a0;font-size:12px}
.journey-progress{height:4px;margin-top:7px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08)}
.journey-progress>span{display:block;height:100%;width:0;background:var(--gold);transition:width .12s linear}
@media(max-width:520px){.journey-buttons{display:grid;grid-template-columns:1fr 1fr 1fr auto}.journey-buttons button{padding:7px 8px;font-size:11px}}


.event-meta{margin:0 0 9px;color:#91a39a;font-size:12px}
.map-marker.active circle:last-of-type{filter:drop-shadow(0 0 7px rgba(226,199,140,.95))}

</style>
</head>

<div class="journey-controls" data-testid="journey-controls">
 <div class="journey-buttons" dir="ltr">
  <button data-testid="journey-previous" aria-label="رویداد پیشین؛ گذشته"><span>←</span><span>گذشته</span></button>
  <button class="journey-play" data-testid="journey-play" aria-label="پخش سفر ۸۱ ثانیه‌ای" aria-pressed="false"><span class="play-symbol">▶</span><span>پخش</span></button>

(() => {
 const EVENTS=[{"id": "1", "date": "۵۵۰ پ.م", "period": "باستان", "title": "برآمدن هخامنشیان", "description": "با شکست آستیاگ، کوروش قدرت ماد را به دست گرفت. از پیوند سرزمین‌های ایرانی، شاهنشاهی تازه‌ای سر برآورد که به‌زودی بسیار فراتر از زاگرس رفت.", "category": "سیاسی", "location": "هگمتانه"}, {"id": "2", "date": "۵۳۹ پ.م", "period": "باستان", "title": "گشوده‌شدن دروازه‌های بابل", "description": "سپاه کوروش به بابل رسید و فرمانروایی نو آغاز شد. نوشته‌های آن روزگار از بازسازی پرستشگاه‌ها و بازگرداندن گروه‌هایی از تبعیدیان سخن می‌گویند.", "category": "سیاسی", "location": "بابل"}, {"id": "3", "date": "۵۲۵ پ.م", "period": "باستان", "title": "راه ایران به مصر رسید", "description": "کمبوجیه از صحرای سینا گذشت و سپاه مصر را شکست داد. در کنار نیل، سرزمینی با سنتی کهن به شاهنشاهی هخامنشی پیوست.", "category": "نظامی", "location": "پلوزیوم"}, {"id": "28", "date": "۵۲۱ پ.م", "period": "باستان", "title": "داریوش و سامان شاهنشاهی", "description": "داریوش پس از فرونشاندن شورش‌ها، سرزمین پهناور را با ساتراپی‌ها و راه‌های ارتباطی به هم پیوند داد. این سامان اداری، تجارت و فرمانروایی را در گسترهٔ شاهنشاهی آسان‌تر کرد.", "category": "سیاسی", "location": "شوش"}, {"id": "4", "date": "۵۱۸ پ.م", "period": "باستان", "title": "سنگ‌های نخست تخت‌جمشید", "description": "در دامنهٔ کوه رحمت، کار ساخت مجموعه‌ای شاهی آغاز شد. هنرمندان سرزمین‌های گوناگون، تصویر یک شاهنشاهی چندقومیتی را بر سنگ نشاندند.", "category": "فرهنگی", "location": "تخت‌جمشید"}, {"id": "5", "date": "۳۳۱ پ.م", "period": "باستان", "title": "غروب هخامنشی در گوگمل", "description": "در دشت گوگمل، سپاه داریوش سوم در برابر اسکندر عقب نشست. راه پایتخت‌ها گشوده شد و نظمی که دو سده دوام آورده بود، فروپاشید.", "category": "نظامی", "location": "گوگمل"}, {"id": "6", "date": "۲۴۷ پ.م", "period": "باستان", "title": "آغاز راه اشکانیان", "description": "در شمال‌شرق، ارشک و همراهانش از سایهٔ سلوکیان بیرون آمدند. این آغاز کوچک، به دودمانی انجامید که سده‌ها با روم رقابت کرد.", "category": "سیاسی", "location": "پارت"}, {"id": "7", "date": "۲۲۴ میلادی", "period": "باستان", "title": "تاج تازهٔ ساسانی", "description": "اردشیر بابکان در هرمزدگان بر اردوان چیره شد. با پایان قدرت اشکانی، خاندان تازه‌ای از فارس برای یکپارچه‌کردن ایران برخاست.", "category": "سیاسی", "location": "هرمزدگان"}, {"id": "8", "date": "۲۶۰ میلادی", "period": "باستان", "title": "امپراتور روم در اسارت", "description": "در نزدیکی ادسا، والرین به اسارت شاپور یکم درآمد. این پیروزی چنان اهمیت یافت که یادش بر صخره‌های فارس حک شد.", "category": "نظامی", "location": "ادسا"}, {"id": "9", "date": "۶۵۱ میلادی", "period": "میانه", "title": "پایان راه یزدگرد", "description": "یزدگرد سوم، دور از پایتخت از دست‌رفته‌اش، در حوالی مرو کشته شد. دولت ساسانی پایان یافت، اما دگرگونی زبان، دین و جامعه در سده‌های بعد ادامه داشت.", "category": "سیاسی", "location": "مرو"}, {"id": "10", "date": "۷۵۰ میلادی", "period": "میانه", "title": "پرچم‌های سیاه خراسان", "description": "جنبشی که از خراسان نیرو گرفته بود، خلافت اموی را کنار زد. عباسیان به قدرت رسیدند و شبکه‌های ایرانی در سیاست و فرهنگ جای بیشتری یافتند.", "category": "سیاسی", "location": "خراسان"}, {"id": "11", "date": "۸۲۱ میلادی", "period": "میانه", "title": "خراسان در دست طاهریان", "description": "طاهر بن حسین فرمان خراسان را گرفت. از دل دستگاه خلافت، حکومتی خانوادگی سر برآورد که در ادارهٔ شرق استقلال عمل بیشتری داشت.", "category": "سیاسی", "location": "نیشابور"}, {"id": "29", "date": "۸۶۱ میلادی", "period": "میانه", "title": "یعقوب، از سیستان تا فرمانروایی", "description": "یعقوب لیث از میان عیاران سیستان برخاست و زرنج را به پایگاه قدرت خود بدل کرد. سپاه او به سوی فارس و خراسان رفت و صفاریان را به بازیگری تازه در شرق تبدیل کرد.", "category": "سیاسی", "location": "زرنج"}, {"id": "12", "date": "۹۴۰ میلادی", "period": "میانه", "title": "فارسی در کوچه‌های بخارا", "description": "در دربار سامانی، شعر فارسی شنونده یافت و رودکی به نامی ماندگار بدل شد. بخارا یکی از کانون‌های رونق زبان و دانش در جهان ایرانی شد.", "category": "فرهنگی", "location": "بخارا"}, {"id": "13", "date": "۱٬۰۱۰ میلادی", "period": "میانه", "title": "روایت ایران در شاهنامه", "description": "فردوسی سال‌ها روایت‌های کهن را در قالب شعر به هم پیوند زد. شاهنامه در صورت نهایی خود، حافظه‌ای ادبی از پهلوانان و پادشاهان به فارسی سپرد.", "category": "فرهنگی", "location": "توس"}, {"id": "14", "date": "۱٬۰۳۷ میلادی", "period": "میانه", "title": "سلجوقیان در نیشابور", "description": "طغرل وارد نیشابور شد و قدرت تازه‌ای شکل گرفت. فرمانروایان ترک‌تبار و دیوان‌سالاران ایرانی در ساختن حکومتی گسترده به هم رسیدند.", "category": "سیاسی", "location": "نیشابور"}, {"id": "30", "date": "۱٬۰۹۲ میلادی", "period": "میانه", "title": "پایان راه خواجه نظام‌الملک", "description": "در مسیر سفر، نظام‌الملک کشته شد و دربار سلجوقی یکی از تکیه‌گاه‌های خود را از دست داد. با مرگ ملکشاه در همان سال، نزاع بر سر جانشینی و قدرت شدت گرفت.", "category": "سیاسی", "location": "نزدیکی نهاوند"}, {"id": "15", "date": "۱٬۲۱۹ میلادی", "period": "میانه", "title": "توفان مغول", "description": "پس از بحران در روابط خوارزمشاهیان و مغولان، سپاه چنگیز به حرکت درآمد. شهرهای بسیاری در سال‌های بعد، محاصره و ویرانی سنگینی را تجربه کردند.", "category": "نظامی", "location": "اترار"}, {"id": "16", "date": "۱٬۲۹۵ میلادی", "period": "میانه", "title": "اصلاحات در روزگار غازان", "description": "غازان‌خان اسلام آورد و بر تخت ایلخانی نشست. تلاش برای سامان‌دادن مالیات و ادارهٔ سرزمین، فصلی تازه پس از دهه‌ها آشفتگی گشود.", "category": "اقتصادی", "location": "تبریز"}, {"id": "31", "date": "۱٬۳۸۷ میلادی", "period": "میانه", "title": "اصفهان زیر سایهٔ تیمور", "description": "شورش در اصفهان با سرکوب و کشتار سنگین سپاه تیمور پاسخ گرفت. در کنار ویرانی شهرها، کوچ اجباری هنرمندان نیز چهرهٔ مراکز فرهنگی منطقه را دگرگون کرد.", "category": "نظامی", "location": "اصفهان"}, {"id": "17", "date": "۱٬۵۰۱ میلادی", "period": "نوین", "title": "صفویان در تبریز", "description": "اسماعیل جوان در تبریز تاج گذاشت و تشیع دوازده‌امامی را رسمی اعلام کرد. ساختار سیاسی و مذهبی ایران وارد دوره‌ای تازه شد.", "category": "سیاسی", "location": "تبریز"}, {"id": "32", "date": "۱٬۵۸۸ میلادی", "period": "نوین", "title": "آغاز دوران شاه عباس", "description": "شاه عباس در روزگار آشفتگی به تخت نشست و بازسازی سپاه و حکومت را پیش گرفت. در دهه‌های بعد، دادوستد و رفت‌وآمد سفیران به رونق شهرهای صفوی گره خورد.", "category": "اقتصادی", "location": "قزوین"}, {"id": "18", "date": "۱٬۵۹۸ میلادی", "period": "نوین", "title": "اصفهان، قلب تازهٔ پادشاهی", "description": "شاه عباس پایتخت را به اصفهان برد. میدان‌ها، پل‌ها و بازارها به هم پیوستند تا شهری ساخته شود که تجارت و هنر در آن همسایه باشند.", "category": "فرهنگی", "location": "اصفهان"}, {"id": "19", "date": "۱٬۷۲۲ میلادی", "period": "نوین", "title": "روزهای دشوار اصفهان", "description": "محاصره، شهر را گرسنه و فرسوده کرد. با تسلیم شاه سلطان‌حسین به محمود افغان، اقتدار صفوی فرو ریخت و سال‌های کشمکش آغاز شد.", "category": "نظامی", "location": "اصفهان"}, {"id": "20", "date": "۱٬۷۳۶ میلادی", "period": "نوین", "title": "تاج‌گذاری در دشت مغان", "description": "نادر در گردهمایی مغان تاج پادشاهی گذاشت. فرمانده‌ای که رقیبان را عقب رانده بود، نام دودمان افشار را بر حکومت ایران نشاند.", "category": "سیاسی", "location": "دشت مغان"}, {"id": "21", "date": "۱٬۹۰۶ میلادی", "period": "معاصر", "title": "صدای مشروطه", "description": "پس از ماه‌ها اعتراض و بست‌نشینی، فرمان مشروطیت صادر شد. مطالبهٔ عدالت‌خانه به تلاشی برای مجلس و محدودکردن قدرت سلطنت رسید.", "category": "اجتماعی", "location": "تهران"}, {"id": "22", "date": "۱٬۹۵۱ میلادی", "period": "معاصر", "title": "نفت، مسئلهٔ یک ملت", "description": "مجلس به ملی‌شدن صنعت نفت رأی داد. کشمکش بر سر منابع نفتی، از آبادان تا میزهای مذاکرهٔ بین‌المللی کشیده شد.", "category": "اقتصادی", "location": "آبادان"}, {"id": "23", "date": "۱٬۹۵۳ میلادی", "period": "معاصر", "title": "کودتای ۲۸ مرداد", "description": "در میانهٔ بحران سیاسی، دولت محمد مصدق سرنگون شد. نقش نیروهای داخلی و عملیات پنهانی آمریکا و بریتانیا، این روز را به نقطه‌ای تعیین‌کننده بدل کرد.", "category": "سیاسی", "location": "تهران"}, {"id": "24", "date": "۱٬۹۷۹ میلادی", "period": "معاصر", "title": "انقلاب و تغییر نظام", "description": "ماه‌ها اعتصاب و تظاهرات، حکومت پهلوی را به پایان رساند. با پیروزی انقلاب و همه‌پرسی پس از آن، جمهوری اسلامی جای نظام پادشاهی را گرفت.", "category": "اجتماعی", "location": "تهران"}, {"id": "25", "date": "۱٬۹۸۰ میلادی", "period": "معاصر", "title": "آغاز هشت سال جنگ", "description": "با حملهٔ عراق، شهرهای مرزی ایران به خط مقدم تبدیل شدند. جنگی که در شهریور آغاز شد، زندگی میلیون‌ها نفر را برای سال‌ها دگرگون کرد.", "category": "نظامی", "location": "خرمشهر"}, {"id": "26", "date": "۲٬۰۱۵ میلادی", "period": "معاصر", "title": "توافق در وین", "description": "پس از سال‌ها مذاکره، ایران و گروه ۱+۵ بر سر برنامهٔ هسته‌ای به توافق رسیدند. امید به کاهش تنش پدید آمد، هرچند آیندهٔ توافق پرکشمکش ماند.", "category": "سیاسی", "location": "تهران · مذاکرات وین"}, {"id": "27", "date": "۲٬۰۲۲ میلادی", "period": "معاصر", "title": "زن، زندگی، آزادی", "description": "مرگ مهسا ژینا امینی پس از بازداشت گشت ارشاد، موجی از اعتراض‌ها برانگیخت. خواسته‌های مربوط به حقوق زنان و آزادی‌های اجتماعی در کانون توجه قرار گرفت.", "category": "اجتماعی", "location": "تهران"}];
 const root=document.getElementById('tarikh-map-embed'),svg=root?.querySelector('.history-map');if(!svg)return;

 let view={x:0,y:0,w:1000,h:500};const initial={...view};
 const apply=()=>svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
 function zoom(f,cx=.5,cy=.5){const ow=view.w,oh=view.h,nw=Math.max(320,Math.min(1500,ow*f)),r=nw/ow,nh=oh*r;view.x+=(ow-nw)*cx;view.y+=(oh-nh)*cy;view.w=nw;view.h=nh;apply()}
 root.querySelector('[data-testid="map-zoom-in"]')?.addEventListener('click',()=>zoom(.8));
 root.querySelector('[data-testid="map-zoom-out"]')?.addEventListener('click',()=>zoom(1.25));
 root.querySelector('[data-testid="map-focus"]')?.addEventListener('click',()=>{view={...initial};apply()});

 let drag=false,sx=0,sy=0,ox=0,oy=0,moved=false;
 svg.addEventListener('pointerdown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;ox=view.x;oy=view.y;svg.setPointerCapture(e.pointerId)});
 svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>4)moved=true;view.x=ox-(e.clientX-sx)*view.w/r.width;view.y=oy-(e.clientY-sy)*view.h/r.height;apply()});
 svg.addEventListener('pointerup',()=>drag=false);svg.addEventListener('pointercancel',()=>drag=false);
 svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?.9:1.1,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});

 const markers=[...root.querySelectorAll('[data-marker="true"]')];
 const markerById=new Map(markers.map(m=>[(m.getAttribute('data-testid')||'').replace('map-event-',''),m]));
 const card=root.querySelector('.map-event'),heading=card?.querySelector('h3'),eyebrow=card?.querySelector('.eyebrow'),desc=card?.querySelector('p'),meta=card?.querySelector('[data-testid="event-meta"]');
 const prev=root.querySelector('[data-testid="journey-previous"]'),next=root.querySelector('[data-testid="journey-next"]'),play=root.querySelector('[data-testid="journey-play"]'),restart=root.querySelector('[data-testid="journey-restart"]');
 const pos=root.querySelector('[data-testid="journey-position"]'),time=root.querySelector('[data-testid="journey-time"]'),progress=root.querySelector('[data-testid="journey-progress"]'),bar=progress?.querySelector('span');
 const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
 const TOTAL=81,step=TOTAL/Math.max(1,EVENTS.length);
 let current=0,playing=false,timer=null,started=0,baseTime=0;

 function elapsed(sec){sec=Math.max(0,Math.min(TOTAL,sec));if(time)time.textContent=`${fa(Math.floor(sec))} / ${fa(TOTAL)} ثانیه`;if(bar)bar.style.width=`${sec/TOTAL*100}%`;progress?.setAttribute('aria-valuenow',Math.floor(sec))}
 function ui(){if(pos)pos.textContent=`${fa(current+1)} از ${fa(EVENTS.length)}`;if(prev)prev.disabled=current===0;if(next)next.disabled=current===EVENTS.length-1}
 function select(i,manual=false){
   current=Math.max(0,Math.min(EVENTS.length-1,i)); const e=EVENTS[current];
   markers.forEach(x=>x.classList.remove('active')); const marker=markerById.get(String(e.id)); if(marker)marker.classList.add('active');
   if(heading)heading.textContent=e.title;
   if(eyebrow)eyebrow.innerHTML=`${e.location} <span> / ${e.date}</span>`;
   if(meta)meta.textContent=[e.period,e.category].filter(Boolean).join(' · ');
   if(desc)desc.textContent=e.description;
   ui(); if(!playing||manual){baseTime=current*step;elapsed(baseTime)}
 }
 function playUI(){play?.setAttribute('aria-pressed',String(playing));const spans=play?.querySelectorAll('span');if(spans?.[0])spans[0].textContent=playing?'Ⅱ':'▶';if(spans?.[1])spans[1].textContent=playing?'توقف':'پخش'}
 function pause(){if(!playing)return;baseTime=Math.min(TOTAL,baseTime+(performance.now()-started)/1000);playing=false;clearInterval(timer);timer=null;playUI();elapsed(baseTime)}
 function start(){if(playing)return;if(baseTime>=TOTAL-.1){current=0;baseTime=0;select(0)}playing=true;started=performance.now();playUI();timer=setInterval(()=>{const e=Math.min(TOTAL,baseTime+(performance.now()-started)/1000);elapsed(e);const target=Math.min(EVENTS.length-1,Math.floor(e/step));if(target!==current){current=target;select(current)}if(e>=TOTAL){baseTime=TOTAL;playing=false;clearInterval(timer);timer=null;current=EVENTS.length-1;select(current);elapsed(TOTAL);playUI()}},100)}
 prev?.addEventListener('click',()=>{pause();select(current-1)});
 next?.addEventListener('click',()=>{pause();select(current+1)});
 play?.addEventListener('click',()=>playing?pause():start());
 restart?.addEventListener('click',()=>{pause();current=0;baseTime=0;select(0);elapsed(0)});
 markers.forEach(m=>{const id=(m.getAttribute('data-testid')||'').replace('map-event-','');const i=EVENTS.findIndex(e=>String(e.id)===id);if(i<0)return;m.addEventListener('click',()=>{if(!moved){pause();select(i,true)}});m.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pause();select(i,true)}})});
 select(0);elapsed(0);playUI();
})();
</script>
